body{margin:0;font-family:system-ui,"Noto Sans Telugu",sans-serif;color:#fff;min-height:100vh;min-height:100dvh;
-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,label,a{touch-action:manipulation}
/* photo layer (fixed, works on mobile browsers) */
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;
background:linear-gradient(160deg,rgba(5,46,22,.55),rgba(22,101,52,.25) 55%,rgba(54,83,20,.50)),var(--bg) center 50%/cover no-repeat}
/* after "Continue Existing Farm": full tree photo, height fits screen, repeats (mirrored) to fill the width */
body.inside::before{background:linear-gradient(160deg,rgba(5,46,22,.45),rgba(22,101,52,.2) 55%,rgba(54,83,20,.4)),var(--bg2) center top/auto 100% repeat-x}
/* login card: top-right, just below the English / తెలుగు buttons */
.login-c{justify-content:flex-end!important;align-items:flex-start!important;padding-top:6px}
.login-c>div{margin:0!important}
h1,.top{text-shadow:0 2px 8px rgba(0,0,0,.65)}
.glass{background:rgba(5,46,22,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);border-radius:24px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.25s}
@media(hover:hover){.glass:hover{transform:translateY(-3px)}}
#app{display:flex;min-height:100vh;min-height:100dvh}
aside{width:230px;padding:16px;background:rgba(5,46,22,.65);backdrop-filter:blur(8px);position:sticky;top:0;height:100vh}
aside h2{margin:0 0 14px}
.nb{display:block;width:100%;text-align:left;font-size:18px;padding:12px;margin:4px 0;border:0;border-radius:16px;background:none;color:#fff;cursor:pointer}
.nb:hover{background:rgba(255,255,255,.2)}.nb.on{background:#facc15;color:#052e16;font-weight:700}
main{flex:1;padding:16px 16px 90px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.lang button{padding:6px 12px;border:1px solid #fff9;background:#fff2;color:#fff;cursor:pointer;font-weight:600}
.lang button:first-child{border-radius:99px 0 0 99px}.lang button:last-child{border-radius:0 99px 99px 0}
.lang .on{background:#facc15;color:#052e16}
h1{font-size:clamp(26px,5vw,44px);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card .v{font-size:clamp(24px,4vw,36px);font-weight:800;color:#fde047;margin-top:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
label{display:block;margin:10px 0 0;font-size:15px}
input,select{width:100%;min-height:48px;font-size:18px;padding:12px;border-radius:14px;border:0;margin-top:4px;background:#fffffff2;color:#111}
.btn{font-size:18px;font-weight:700;padding:14px 22px;border:0;border-radius:16px;cursor:pointer;color:#052e16;background:linear-gradient(90deg,#facc15,#f97316);box-shadow:0 4px 12px #0005;transition:.2s;margin-top:14px}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.96)}.full{width:100%}
.red{background:#dc2626;color:#fff}
.item{background:rgba(0,0,0,.25);border-radius:16px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item small{opacity:.8;display:block}.item button{background:none;border:0;color:#fca5a5;cursor:pointer;font-size:16px}
.bar{height:26px;border-radius:99px;background:linear-gradient(90deg,#4ade80,#facc15);transition:width .8s;min-width:4px}
.tog{display:flex;gap:8px;margin-top:10px}.tog button{flex:1;padding:12px;border:0;border-radius:14px;font-size:16px;font-weight:600;background:#fff3;color:#fff;cursor:pointer}.tog .on{background:#facc15;color:#052e16}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:16px;font-weight:700;z-index:99;display:none;background:#16a34a}
nav.bot{display:none}
.fade{animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

main{padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .glass{padding:14px;border-radius:20px}
.card .v{font-size:clamp(20px,6vw,28px);word-break:break-word}
.grid .btn{font-size:16px!important;padding:16px 8px!important;margin-top:0}
.glass{padding:16px}
.item{flex-wrap:wrap}
.top{flex-wrap:wrap}
#toast{width:calc(100% - 24px);max-width:420px;text-align:center;top:calc(10px + env(safe-area-inset-top))}

nav.bot button{font-size:26px;background:none;border:0;padding:8px 10px;min-width:44px;min-height:44px;border-radius:12px;cursor:pointer}nav.bot .on{background:#facc15}}

async function hp(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("mango:"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
 catch(e){let h=5381;for(const c of "mango:"+p)h=(h*33^c.charCodeAt(0))>>>0;return "f"+h}}
const userName=()=>(users.find(u=>u.id==cur)||{}).name||"";
function loginAs(u){const lang=S.lang;cur=u.id;SS.setItem("mango-cur",cur);KEY=LEGACY+":"+cur;
 S=Object.assign(blank(),JSON.parse(LS.getItem(KEY)||"{}"));S.lang=lang;entered=false;step=0;page="dash";W={variety:"Banganapalli",year:"2026–2027",initial:"0"};render()}
function logout(){SS.removeItem("mango-cur");cur=null;KEY=LEGACY;const lang=S.lang;S=blank();S.lang=lang;entered=false;authMode="login";render()}
async function doReg(){
 const n=$("rn").value.trim(),m=$("rm").value.trim(),p=$("rp").value,c=$("rc").value;
 if(!n)return toast(t("nameReq"),1);
 if(!/^[6-9]\d{9}$/.test(m))return toast(t("mobileBad"),1);
 if(p.length<4)return toast(t("pwShort"),1);
 if(p!==c)return toast(t("pwMismatch"),1);
 if(users.some(u=>u.mobile==m))return toast(t("exists"),1);
 const u={id:uid(),name:n,mobile:m,pw:await hp(p)};users.push(u);LS.setItem(UK,JSON.stringify(users));
 const old=LS.getItem(LEGACY); /* keep farm data saved before accounts existed */
 if(old&&users.length==1)LS.setItem(LEGACY+":"+u.id,old);
 loginAs(u);toast(t("regOk"))}
async function doLogin(){
 const m=$("rm").value.trim(),h=await hp($("rp").value),u=users.find(x=>x.mobile==m&&x.pw==h);
 if(!u)return toast(t("wrong"),1);loginAs(u);toast(t("welcome"))}
function auth(){
 const reg=authMode=="reg";
 return `<div class="glass fade" style="max-width:420px;width:100%"><div style="text-align:center;font-size:52px">🥭</div>
 <h2 style="text-align:center;margin:6px 0 4px">${t(reg?"reg":"login")}</h2>${reg?`<p style="text-align:center;opacity:.85;margin:0 0 6px">${t("regSub")}</p>`:""}
 ${reg?F("rn",t("fullName")):""}${F("rm",t("mobile"),"tel")}${F("rp",t("password"),"password")}${reg?F("rc",t("confirmPw"),"password"):""}
 <button class="btn full" onclick="${reg?"doReg()":"doLogin()"}">${t(reg?"reg":"login")}</button>
 <p style="text-align:center;margin:14px 0 0"><a href="#" style="color:#fde047;font-weight:600" onclick="authMode='${reg?"login":"reg"}';render();return false">${t(reg?"haveAcc":"newUser")}</a></p></div>`}

function wizard(){
 const st=[["name","farmName","text"],["location","location","text"],["trees","trees","number"],["variety","variety","select"],["year","year","text"],["initial","startInv","number"]];
 const [k,l,ty]=st[step];
 const inp=ty=="select"?`<select id="w">${VARS.map(v=>`<option ${W[k]==v?"selected":""}>${v}</option>`).join("")}</select>`:F("w",t(l),ty,W[k]||"").replace(/<label>.*?<input/,"<input").replace(/<\/label>/,"");
 return `<div style="margin:auto;max-width:420px;width:100%;padding:16px" class="fade"><div class="glass"><p style="opacity:.7">${step+1} / ${st.length}</p>
 <h2>${t(l)}</h2>${inp}<div style="display:flex;gap:10px">${step?`<button class="btn" style="background:#fff3;color:#fff" onclick="wnext(-1)">←</button>`:""}
 <button class="btn full" onclick="wnext(1)">${step<st.length-1?t("next"):t("create")}</button></div></div></div>`;
}
function wnext(d){
 const st=["name","location","trees","variety","year","initial"],k=st[step];
 if(d>0){const v=$("w").value.trim();if(k!="initial"&&!v)return toast(t("invalid"),1);if((k=="trees"||k=="initial")&&!(Number(v||0)>=0))return toast(t("invalid"),1);W[k]=v;
  if(step==5){S.farm={id:uid(),name:W.name,location:W.location,treeCount:+W.trees,variety:W.variety,farmingYear:W.year,createdAt:new Date().toISOString()};
   if(+W.initial>0)S.exp.push({id:uid(),date:today(),category:"Other",description:"Initial investment",amount:+W.initial,notes:""});
   save();entered=true;render();return toast(t("created"));}
  step++}else{W[k]=$("w").value;step--}
 render();
}
function dash(){
 const cards=[["🌱 "+t("totalInv"),C.inv(),0],["🥭 "+t("mangoes"),C.harv(),3],["💰 "+t("totalSales"),C.rev(),0],["📈 "+t("net"),C.net(),0],["📊 "+t("pct"),C.pct(),1],["💵 "+t("cpm"),C.cpm(),2]];
 const fmt=(v,m)=>v==null?t("na"):m==3?Math.round(v).toLocaleString("en-IN"):m==1?v.toFixed(2)+"%":inr(v,m);
 return `<h1>${t("dash")}</h1><div class="grid">${cards.map(c=>`<div class="glass card"><div>${c[0]}</div><div class="v num" data-v="${c[1]??""}" data-m="${c[2]}">${fmt(c[1],c[2])}</div></div>`).join("")}</div>
 <div class="grid" style="margin-top:18px">${[["inv","➕ "+t("addInv")],["prod","🥭 "+t("addProd")],["sales","💰 "+t("addSale")],["profit","📊 "+t("viewProfit")],["rep","📄 "+t("rep")]].map(a=>`<button class="btn" style="font-size:20px;padding:20px" onclick="go('${a[0]}')">${a[1]}</button>`).join("")}</div>`;
}
function inv(){
 const list=S.exp.filter(e=>!flt||e.category==flt).sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="two"><div class="glass"><h2>${t("addInv")}</h2>${F("d",t("date"),"date",today())}<label>${t("category")}<select id="c">${catOpts()}</select></label>
 ${F("ds",t("desc"))}${F("a",t("amount"),"number")}${F("ta",t("treesAff"),"number")}${F("n",t("notes"))}<button class="btn full" onclick="addInv()">${t("save")}</button></div>
 <div class="glass"><b style="font-size:20px">${t("totalInv")}: ${inr(sum(list.map(x=>x.amount)))}</b>
 <select onchange="flt=this.value;render()" style="margin:10px 0">${catOpts(1)}</select>
 ${list.length?list.map(e=>`<div class="item"><div><b>${t("cat")[e.category]} · ${inr(e.amount)}</b><small>${e.date} · ${e.description||""}</small></div><button onclick="delItem('exp','${e.id}')">🗑 ${t("del")}</button></div>`).join(""):`<p style="text-align:center;padding:24px">${t("emptyInv")}</p>`}</div></div>`;
}
function addInv(){const a=num("a"),ta=$("ta").value===""?null:num("ta");
 if(!(a>0)||(ta!==null&&!(ta>=0)))return toast(t("invalid"),1);
 S.exp.push({id:uid(),date:$("d").value,category:$("c").value,description:$("ds").value,amount:a,treesAffected:ta,notes:$("n").value});save();toast(t("saved"));render()}
function delItem(k,id){if(confirm(t("confirmDel"))){S[k]=S[k].filter(x=>x.id!=id);save();render()}}
function prod(){
 const h=C.harv(),dm=sum(S.prod.map(x=>x.damaged)),tr=S.farm.treeCount;
 return `<div class="two"><div class="glass"><h2>${t("addProd")}</h2>${F("d",t("date"),"date",today())}${["harvested","damaged","gradeA","gradeB","other"].map(k=>F(k,t(k),"number")).join("")}${F("n",t("notes"))}
 <button class="btn full" onclick="addProd()">${t("save")}</button></div>
 <div class="glass" style="font-size:20px;line-height:2"><div>🥭 ${t("harvested")}: <b>${h.toLocaleString("en-IN")}</b></div><div>✅ ${t("good")}: <b>${(h-dm).toLocaleString("en-IN")}</b></div>
 <div>⚠️ ${t("damaged")}: <b>${dm.toLocaleString("en-IN")}</b></div><div>🌳 ${t("trees")}: <b>${tr}</b></div><div>📊 ${t("avg")}: <b>${tr>0&&h>0?(h/tr).toFixed(1):t("na")}</b></div></div></div>`;
}

 return `<div class="two"><div class="glass"><h2>${t("addSale")}</h2>${F("d",t("date"),"date",today())}${F("v",t("variety"),"text",S.farm.variety)}
 <div class="tog"><button class="${stype=="mango"?"on":""}" onclick="stype='mango';render()">${t("perMango")}</button><button class="${stype=="kg"?"on":""}" onclick="stype='kg';render()">${t("perKg")}</button></div>
 ${F("q",t("qty")+(stype=="kg"?" (kg)":""),"number")}${F("p",t("price"),"number")}
 <p style="font-size:24px;font-weight:800;color:#fde047">${t("total")}: <span id="tot">₹0</span></p>${F("b",t("buyer"))}${F("n",t("notes"))}
 <button class="btn full" onclick="addSale()">${t("save")}</button></div>
 <div class="glass"><b style="font-size:20px">${t("totalSales")}: ${inr(C.rev())}</b>
 ${S.sales.length?S.sales.map(s=>`<div class="item"><div><b>${inr(s.total)} · ${s.quantity} ${s.type=="kg"?"kg":"🥭"} × ₹${s.price}</b><small>${s.date} · ${s.buyer||""}</small></div><button onclick="delItem('sales','${s.id}')">🗑</button></div>`).join(""):`<p style="text-align:center;padding:24px">${t("noSales")}</p>`}</div></div>`;
}
function calcTot(){const e=$("tot");if(e)e.textContent=inr((num("q")||0)*(num("p")||0),2)}
function addSale(){const q=num("q"),p=num("p");if(!(q>0)||!(p>0))return toast(t("invalid"),1);
 S.sales.push({id:uid(),date:$("d").value,variety:$("v").value,quantity:q,type:stype,price:p,total:q*p,buyer:$("b").value,notes:$("n").value});save();toast(t("saleSaved"));render()}
function profit(){
 const r=[[t("totalInv"),inr(C.inv())],[t("totalSales"),inr(C.rev())],[t("net"),inr(C.net())],[t("pct"),C.pct()==null?t("na"):C.pct().toFixed(2)+"%"],[t("cpm"),inr(C.cpm(),2)],[t("rpm"),inr(C.rpm(),2)]];
 return `<h1>${t("profit")}</h1><div class="grid">${r.map(x=>`<div class="glass card"><div>${x[0]}</div><div class="v">${x[1]}</div></div>`).join("")}</div>`;
}
function bars(rows){const m=Math.max(1,...rows.map(r=>Math.abs(r[1])));
 return rows.map(r=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${r[0]}</span><b>${inr(r[1])}</b></div><div class="bar" style="width:${Math.abs(r[1])/m*100}%;${r[2]?`background:${r[2]}`:""}"></div></div>`).join("")}
function rep(){
 const mo={};S.exp.forEach(e=>{const k=e.date.slice(0,7);(mo[k]=mo[k]||{i:0,s:0}).i+=e.amount});S.sales.forEach(s=>{const k=s.date.slice(0,7);(mo[k]=mo[k]||{i:0,s:0}).s+=s.total});
 const cat={};S.exp.forEach(e=>cat[e.category]=(cat[e.category]||0)+e.amount);
 return `<h1>${t("rep")}</h1><div class="two"><div class="glass"><h3>${t("cIR")}</h3>${bars([[t("investment"),C.inv(),"#f97316"],[t("revenue"),C.rev(),"#facc15"],[t("net"),Math.max(C.net(),0),"#4ade80"]])}</div>
 <div class="glass"><h3>${t("cCat")}</h3>${bars(Object.entries(cat).map(([k,v])=>[t("cat")[k],v]))||""}</div>
 <div class="glass"><h3>${t("cMonthly")}</h3>${Object.keys(mo).sort().map(k=>`<b>${k}</b>${bars([[t("investment"),mo[k].i,"#f97316"],[t("revenue"),mo[k].s,"#facc15"]])}`).join("")}</div></div>`;
}
function set(){return `<div class="glass" style="max-width:420px"><p style="margin:0 0 4px;font-size:18px">👤 <b>${userName()}</b></p><button class="btn full" onclick="expJ()">⬇ ${t("exp")}</button>
 <label class="btn full" style="display:block;text-align:center;cursor:pointer">⬆ ${t("imp")}<input type="file" accept=".json" hidden onchange="impJ(this.files[0])"></label>
 <button class="btn full" onclick="expC()">📄 ${t("csv")}</button><button class="btn full" onclick="logout()">🚪 ${t("logout")}</button><button class="btn full red" onclick="wipe()">🗑 ${t("deleteAll")}</button></div>`}
/* download / share a file - works on phones (share sheet) and computers (normal download) */
async function dl(n,x,ty){
 const blob=new Blob([x],{type:ty});
 const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
 if(mobile&&navigator.canShare&&navigator.share){
  try{const f=new File([blob],n,{type:ty});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return}}
  catch(e){if(e&&e.name=="AbortError")return}}
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=n;a.style.display="none";document.body.appendChild(a);a.click();
 setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},5000);toast("✔ "+n)}

/* ===== EXPORT: now includes Total Investment, Total Sales, Net Profit ===== */
const summary=()=>({totalInvestment:C.inv(),totalSales:C.rev(),netProfit:C.net(),
 profitPercent:C.pct()==null?null:+C.pct().toFixed(2),mangoesHarvested:C.harv(),
 costPerMango:C.cpm(),incomePerMango:C.rpm()});

const expJ=()=>dl("mango-farm.json",JSON.stringify({...S,summary:summary()},null,2),"application/json");

const expC=()=>{
 const q=v=>`"${String(v??"").replace(/"/g,'""')}"`, row=a=>a.map(q).join(",");
 const s=summary();
 const lines=[
  row(["SUMMARY"]),
  row(["Farm",S.farm?S.farm.name:""]),
  row(["Total Investment",s.totalInvestment]),
  row(["Total Sales",s.totalSales]),
  row(["Net Profit",s.netProfit]),
  row(["Profit %",s.profitPercent==null?"N/A":s.profitPercent+"%"]),
  row(["Mangoes Harvested",s.mangoesHarvested]),
  row(["Cost Per Mango",s.costPerMango==null?"N/A":s.costPerMango.toFixed(2)]),
  row(["Income Per Mango",s.incomePerMango==null?"N/A":s.incomePerMango.toFixed(2)]),
  "",row(["EXPENSES"]),row(["date","category","description","amount","notes"]),
  ...S.exp.map(e=>row([e.date,e.category,e.description,e.amount,e.notes])),
  "",row(["SALES"]),row(["date","variety","type","quantity","price","total","buyer"]),
  ...S.sales.map(x=>row([x.date,x.variety,x.type,x.quantity,x.price,x.total,x.buyer]))
 ];
 dl("mango-farm-report.csv","\ufeff"+lines.join("\n"),"text/csv");
};

function impJ(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.exp)||!Array.isArray(j.sales))throw 0;j.lang=S.lang;delete j.summary;S=j;save();toast(t("imported"));render()}catch(e){toast(t("badFile"),1)}};r.readAsText(f)}
function wipe(){if(confirm(t("confirmAll"))){S={farm:null,exp:[],prod:[],sales:[],lang:S.lang};save();entered=false;step=0;page="dash";render()}}

const NAV=[["dash","🏠"],["inv","💰"],["prod","🥭"],["sales","💵"],["profit","📊"],["rep","📈"],["set","⚙️"]], PG={dash,inv,prod,sales,profit,rep,set};
const langBtn=()=>`<div class="lang"><button class="${S.lang=="en"?"on":""}" onclick="setLang('en')">English</button><button class="${S.lang=="te"?"on":""}" onclick="setLang('te')">తెలుగు</button></div>`;
function render(){
 const A=$("app");
 if(!cur){document.body.classList.remove("inside");A.innerHTML=shell(auth());
  A.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key=="Enter")(authMode=="reg"?doReg:doLogin)()});return}
 document.body.classList.toggle("inside",!!(S.farm&&entered));
 if(!S.farm||!entered){
  A.innerHTML=`<div style="flex:1;display:flex;flex-direction:column;padding:16px"><div style="align-self:flex-end">${langBtn()}</div><div class="login-c" style="flex:1;display:flex;align-items:center;justify-content:center">`+
  (!S.farm?wizard():`<div class="glass fade" style="text-align:center"><div style="font-size:64px">🥭</div><h1>${S.farm.name}</h1><button class="btn" onclick="entered=true;render()">${t("cont")}</button></div>`)+`</div></div>`;return}
 A.innerHTML=`<aside><h2>🥭 ${S.farm.name}</h2>${NAV.map(n=>`<button class="nb ${page==n[0]?"on":""}" onclick="go('${n[0]}')">${n[1]} ${t(n[0])}</button>`).join("")}</aside>
 <main><div class="top"><span style="font-size:18px">${t("year")}: <b>${S.farm.farmingYear}</b></span>${langBtn()}</div><div class="fade">${PG[page]()}</div></main>
 <nav class="bot">${NAV.map(n=>`<button class="${page==n[0]?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("")}</nav>`;
 document.querySelectorAll("[id=q],[id=p]").forEach(e=>e.oninput=calcTot);
 document.querySelectorAll(".num").forEach(e=>{const v=e.dataset.v;if(v==="")return;const m=+e.dataset.m,to=+v,s=performance.now();
  const f=n=>m==3?Math.round(n).toLocaleString("en-IN"):m==1?n.toFixed(2)+"%":inr(n,m);
  (function tick(n){const p=Math.min((n-s)/700,1);e.textContent=f(to*p);if(p<1)requestAnimationFrame(tick)})(s)});
}
{const su=users.find(u=>u.id==cur);if(su)loginAs(su);else cur=null}
render();
if(!storageOk){const w=document.createElement("div");
 w.textContent="⚠️ This browser is blocking storage, so your data will NOT be saved. Open the file in Chrome/Safari or host it online. (Tap to close)";
 w.style.cssText="position:fixed;top:0;left:0;right:0;z-index:60;background:#b45309;color:#fff;padding:10px 14px;font-size:14px;text-align:center;cursor:pointer";
 w.onclick=()=>w.remove();document.body.appendChild(w)}
</script></body></html>
